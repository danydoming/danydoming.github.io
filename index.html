<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daniela Dominguez Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: product-page style. Full-width bands alternating white, soft gray and black. Each menu item is its own view: home (intro + work index), one page per project, More work, Experience, Skills. All content comes from data/site.json and is edited in the side panel. */
/* always dark, on every device and setting */
:root {
  color-scheme: dark;
  --page: #000000;
  --page-alt: #161617;
  --surface-2: #1d1d1f;
  --line: #424245;
  --fg: #f5f5f7;
  --muted: #a1a1a6;
  --accent: #c77dff;
  --accent-2: #ff9f0a;
  --good: #30d158;
  --bad: #ff453a;
  --todo-bg: rgba(255, 159, 10, .18);
  --todo-fg: #ffcf70;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg: 28px; --r-md: 22px; --r-sm: 14px;
  --panel-w: 460px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000000; --page-alt: #161617; --surface-2: #1d1d1f; --line: #424245; --fg: #f5f5f7; --muted: #a1a1a6;
    --accent: #c77dff; --accent-2: #ff9f0a; --good: #30d158; --bad: #ff453a;
    --todo-bg: rgba(255, 159, 10, .18); --todo-fg: #ffcf70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000000; --page-alt: #161617; --surface-2: #1d1d1f; --line: #424245; --fg: #f5f5f7; --muted: #a1a1a6;
  --accent: #c77dff; --accent-2: #ff9f0a; --good: #30d158; --bad: #ff453a;
  --todo-bg: rgba(255, 159, 10, .18); --todo-fg: #ffcf70; color-scheme: dark;
}

* { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body {
  background: var(--page); color: var(--fg);
  font: 17px/1.55 var(--body); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- bands ---------- */
.band {
  --bg: var(--page); --surface: var(--page-alt);
  background: var(--bg); color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 1080px) / 2));
  padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 1080px) / 2));
  padding-block: clamp(64px, 9vw, 120px);
  min-width: 0;
}
.band[data-tone="alt"] { --bg: var(--page-alt); --surface: var(--page); }
.band[data-tone="dark"] {
  --page: #000000; --page-alt: #161617; --surface-2: #1d1d1f; --line: #424245; --fg: #f5f5f7; --muted: #a1a1a6;
  --accent: #c77dff; --accent-2: #ff9f0a; --good: #30d158; --bad: #ff453a;
  --todo-bg: rgba(255, 159, 10, .18); --todo-fg: #ffcf70;
}
.band[data-tone="hero"] {
  --page: #000000; --page-alt: #161617; --surface-2: #1d1d1f; --line: #424245; --fg: #f5f5f7; --muted: #a1a1a6;
  --accent: #c77dff; --accent-2: #ff9f0a; --todo-bg: rgba(255, 159, 10, .18); --todo-fg: #ffcf70;
}
.band.footer { padding-block: 28px 40px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center; }
#view { min-height: 60vh; }

h1, h2, h3, h4, h5 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.08; letter-spacing: -.022em; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.label { font-size: 14px; font-weight: 600; color: var(--muted); }
.todo { background: var(--todo-bg); color: var(--todo-fg); border-radius: 6px; padding: 0 .35em; }
/* author's reminders stay hidden until switched on from the footer */
body:not(.notes) .todo, body:not(.notes) .draft { display: none; }

/* ---------- top bar ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--page) 72%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.nav-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 24px; min-height: 48px; }
.nav-name { font-weight: 600; font-size: 15px; white-space: nowrap; color: var(--fg); }
.nav-name:hover { text-decoration: none; }
.nav-links { display: flex; gap: 4px 22px; overflow-x: auto; scrollbar-width: none; font-size: 12.5px; margin-left: auto; min-width: 0; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { color: var(--fg); opacity: .7; white-space: nowrap; padding-block: 6px; transition: opacity .15s; }
.nav-links a:hover { opacity: 1; text-decoration: none; }
.nav-links a[aria-current="page"] { opacity: 1; color: var(--accent); }
.nav-edit { flex: none; font: 500 12.5px var(--body); color: #ffffff; background: #0071e3; border: 0; border-radius: 980px; padding: 5px 13px; cursor: pointer; position: relative; }
.nav-edit:hover { background: #0077ed; }
.nav-edit .dot { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: #ff9f0a; border: 2px solid var(--page); }

/* ---------- hero ---------- */
.hero { display: grid; gap: 36px; justify-items: center; text-align: center; }
.band.hero { padding-top: clamp(40px, 6vw, 72px); }
.name-art { margin: 0; width: 100%; max-width: 980px; display: grid; gap: 4px; }
.name-art img { display: block; width: 100%; height: auto; }
.name-art figcaption { font-size: 12.5px; color: var(--muted); }
.hero-text { display: grid; gap: 16px; justify-items: center; min-width: 0; }
.hero .eyebrow { color: var(--accent-2); font-size: 17px; font-weight: 600; }
.hero h1 { font-size: clamp(44px, 7.4vw, 88px); font-weight: 700; letter-spacing: -.035em; line-height: 1; }
.hero .role { font-size: clamp(19px, 2.2vw, 23px); line-height: 1.38; color: var(--muted); max-width: 34em; }
.hero .role p { margin: 0; }
.hero .role strong { color: var(--fg); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; font-size: 14px; color: var(--muted); }
.links span { border: 1px solid var(--line); border-radius: 980px; padding: 5px 14px; background: var(--page-alt); }
.links span.todo { border-color: transparent; background: var(--todo-bg); }
.stats { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 24px; padding-top: 28px; border-top: 1px solid var(--line); }
.stats div { display: grid; gap: 8px; align-content: start; justify-items: center; }
.stats b { font-family: var(--display); font-size: clamp(32px, 4.4vw, 52px); font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.stats span { font-size: 14px; color: var(--muted); line-height: 1.4; max-width: 22em; }

/* ---------- section heads ---------- */
.sec-head { display: grid; justify-items: center; text-align: center; gap: 6px; }
.sec-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; color: var(--accent-2); }
.sec-head.big h2 { font-size: clamp(34px, 5.2vw, 56px); letter-spacing: -.025em; color: var(--fg); }
.sec-head .lede { font-size: clamp(17px, 2vw, 21px); color: var(--muted); max-width: 34em; margin-top: 6px; }
.stack { display: grid; gap: 36px; }
.more-link { justify-self: center; font-size: 17px; }

/* ---------- work index ---------- */
.index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.index a { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border-radius: var(--r-md); overflow: hidden; color: var(--fg); transition: transform .2s ease; }
.index a:hover { text-decoration: none; transform: translateY(-3px); }
.index img, .index .ph { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--surface-2); border-radius: 0; }
.index .body { padding: 18px 18px 20px; display: grid; gap: 6px; align-content: start; }
.index .num { font-size: 13px; font-weight: 600; color: var(--accent-2); }
.index h3 { font-size: 21px; letter-spacing: -.02em; }
.index p { font-size: 14.5px; line-height: 1.4; color: var(--muted); }
.go { font-size: 14.5px; color: var(--accent); margin-top: 4px; }

/* ---------- project ---------- */
.project { display: grid; gap: 48px; }
.back { justify-self: start; font-size: 15px; margin-bottom: -20px; }
.proj-title { display: grid; gap: 18px; justify-items: center; text-align: center; margin-top: -28px; }
.proj-title h3 { font-size: clamp(40px, 7.2vw, 84px); letter-spacing: -.03em; line-height: 1.03; }
.proj-title .tagline { font-size: clamp(19px, 2.3vw, 26px); line-height: 1.3; font-weight: 500; color: var(--muted); max-width: 30em; }
/* a **bold** opening in a tagline becomes the big question */
.proj-title .tagline strong { display: block; margin: 6px auto 14px; font-family: var(--display); font-size: clamp(30px, 4.8vw, 54px); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; color: var(--accent-2); background: linear-gradient(90deg, #ff6a3d 0%, #ff9f0a 45%, #bf5af2 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.proj-title.sub { margin-top: 40px; }
.proj-title.sub h3 { font-size: clamp(32px, 5vw, 56px); }
.figure { margin: 0; display: grid; gap: 10px; min-width: 0; align-content: start; }
.figure img, .figure video { width: 100%; max-width: 100%; display: block; border-radius: var(--r-md); background: var(--surface-2); }
.figure figcaption { font-size: 13px; color: var(--muted); line-height: 1.4; padding-inline: 4px; }
.lead-fig img, .lead-fig video, .lead-fig .ph { aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--r-lg); }
.wide-fig img, .wide-fig video, .wide-fig .ph { aspect-ratio: 21 / 9; object-fit: cover; border-radius: var(--r-lg); }
.white-fig img { background: #ffffff; padding: 12px; }
.ph { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-md); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 14px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; align-items: start; }
.cols.solo { grid-template-columns: minmax(0, 1fr); justify-items: center; }
.cols.solo .story { width: 100%; max-width: 62ch; }
.story { display: grid; gap: 40px; min-width: 0; }
.story section { display: grid; gap: 12px; max-width: 62ch; }
.story h4 { font-size: 26px; letter-spacing: -.02em; }
.story ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; }
.story li::marker { color: var(--muted); }
code { font-family: var(--mono); font-size: .85em; background: var(--surface-2); padding: .1em .4em; border-radius: 6px; letter-spacing: 0; }

.spec { background: var(--surface); border-radius: var(--r-md); padding: 26px; display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); }
.spec .label { font-size: 19px; color: var(--fg); letter-spacing: -.015em; }
.spec dl { margin: 0; display: grid; }
.spec dl div { display: grid; gap: 2px; padding-block: 11px; border-top: 1px solid var(--line); }
.spec dt { font-size: 12px; font-weight: 600; color: var(--muted); }
.spec dd { margin: 0; font-size: 15px; line-height: 1.4; font-variant-numeric: tabular-nums; }

.diagram { overflow-x: auto; }
.diagram svg { display: block; width: 100%; min-width: 460px; height: auto; }
.diagram text { font-family: var(--body); font-size: 11px; fill: var(--muted); letter-spacing: 0; }
.diagram .strong { fill: var(--fg); font-size: 12px; font-weight: 600; }

.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.gallery img, .gallery video, .gallery .ph { aspect-ratio: 4 / 3; object-fit: cover; }
.gallery.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gallery.tall img, .gallery.tall .ph { aspect-ratio: 3 / 4; }
.gallery.plots img { aspect-ratio: 1 / 1; object-fit: contain; background: #ffffff; padding: 10px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pair img { aspect-ratio: 3 / 4; object-fit: cover; border-radius: var(--r-sm); }

.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.compare .card { background: var(--surface); border-radius: 18px; padding: 20px; display: grid; gap: 6px; align-content: start; }
.compare .card h5 { font-size: 17px; letter-spacing: -.01em; }
.compare .card p { font-size: 15px; color: var(--muted); }
.compare .card.mine { box-shadow: inset 0 0 0 1.5px var(--accent); }

.video-link { position: relative; display: block; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: #000000; }
.video-link img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; transform: scale(1.34); }
.video-link .play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .18); transition: background .2s; }
.video-link:hover .play { background: rgba(0, 0, 0, .05); }
.video-link .play span { display: inline-flex; align-items: center; gap: 10px; font: 600 17px var(--body); color: #1d1d1f; background: rgba(255, 255, 255, .92); border-radius: 980px; padding: 12px 24px; }
.video-link .play svg { width: 16px; height: 16px; }

/* test campaign */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 18px; padding-block: 18px; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline h5 { font-size: 19px; letter-spacing: -.015em; margin-bottom: 4px; }
.timeline p { font-size: 16px; color: var(--muted); }
.tl-tag { white-space: nowrap; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 980px; background: var(--surface); color: var(--muted); align-self: start; justify-self: start; text-align: center; }
.tl-tag.fail { color: var(--bad); }
.tl-tag.partial { color: var(--accent-2); }
.tl-tag.pass { color: var(--good); }
.tl-tag.next { color: var(--accent); }

.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px 8px 0; white-space: nowrap; }
.tbl td { padding: 9px 12px 9px 0; border-top: 1px solid var(--line); white-space: nowrap; }
.tbl td.best { color: var(--good); font-weight: 600; }
.tbl td.worst { color: var(--bad); font-weight: 600; }
.project > .figure:not(.lead-fig):not(.wide-fig) > img, .project > .figure:not(.lead-fig):not(.wide-fig) > video { width: auto; max-width: 100%; max-height: 78vh; justify-self: center; }
.project > .figure:not(.lead-fig):not(.wide-fig) > video + figcaption { text-align: center; }

/* findings: stat cards, step-by-step pipeline, application cards */
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facts > div { background: var(--surface); border-radius: 18px; padding: 18px 18px 16px; display: grid; gap: 6px; align-content: start; }
.facts b { font-family: var(--display); font-size: clamp(26px, 3.4vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--accent); }
.facts > div:nth-child(2) b { color: var(--accent-2); }
.facts > div:nth-child(3) b { color: var(--good); }
.facts > div:nth-child(4) b { color: var(--fg); }
.facts span { font-size: 14px; color: var(--muted); line-height: 1.35; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: st; }
.steps > li { counter-increment: st; background: var(--surface); border-radius: 18px; padding: 18px 18px 18px 62px; position: relative; display: grid; gap: 8px; min-width: 0; }
.steps > li::before { content: counter(st); position: absolute; left: 18px; top: 17px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #ffffff; font: 600 14px/28px var(--body); text-align: center; }
.steps > li > b { font-size: 18px; letter-spacing: -.01em; }
.steps p { font-size: 15.5px; color: var(--muted); }
.steps p strong, .apps p strong { color: var(--fg); font-weight: 600; }
.steps .legend { font-size: 13.5px; }
/* equations */
.eqs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.eq { display: block; white-space: nowrap; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px 12px; font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif; font-size: 23px; line-height: 1.2; color: var(--fg); letter-spacing: 0; text-align: center; overflow-x: auto; }
.eq small { display: block; margin-top: 8px; white-space: normal; font-family: var(--body); font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
.eq i { font-style: italic; }
.eq .v { font-weight: 700; font-style: normal; font-size: inherit; }
.eq sub, .eq sup { font-size: .6em; }
.eq sub { font-family: var(--body); font-style: normal; }
.fr { display: inline-grid; vertical-align: middle; text-align: center; margin: 0 .12em; }
.fr > span { padding: 0 .2em; line-height: 1.15; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; }
.sq { display: inline-flex; align-items: stretch; }
.sq > span { border-top: 1.5px solid currentColor; padding: .08em .15em 0; display: inline-flex; align-items: center; }
details.code { border-radius: 12px; }
details.code summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); width: max-content; }
details.code[open] summary { margin-bottom: 8px; }
/* "why this is cool": puzzle card + history timeline */
.hook { position: relative; overflow: hidden; border-radius: 22px; padding: 22px 22px 14px; display: grid; gap: 10px;
  background: radial-gradient(120% 130% at 100% 0%, rgba(255, 106, 61, .26), transparent 55%), radial-gradient(110% 120% at 0% 100%, rgba(191, 90, 242, .22), transparent 55%), var(--surface); }
.hook-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ff9f0a; }
.hook h5 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 700; letter-spacing: -.03em; line-height: 1.08; margin-top: 4px; }
.hook p { font-size: 16.5px; color: var(--muted); max-width: 36em; }
.hook p strong { color: var(--fg); font-weight: 600; }
.hook-loop { display: block; width: 100%; height: auto; margin-top: 2px; }
.hk-stars circle { fill: var(--fg); opacity: .45; }
.hk-lbl { font: 600 10.5px var(--body); fill: #bf5af2; }
.band:not([data-tone="dark"]) .hk-lbl { fill: #8944ab; }
.hk-lbl2 { font: 500 10px var(--body); fill: var(--muted); }
.era { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; position: relative; }
.era::before { content: ""; position: absolute; left: 6px; right: 6px; top: 6px; height: 2px; background: linear-gradient(90deg, var(--line), #ff9f0a 60%, var(--accent)); border-radius: 2px; }
.era li { position: relative; padding-top: 24px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.era li::before { content: ""; position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); box-sizing: border-box; }
.era li.hl::before { border-color: #ff9f0a; background: #ff9f0a; box-shadow: 0 0 0 5px rgba(255, 159, 10, .18); }
.era li.me::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
.era .yr { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.era li.hl .yr { color: #ff9f0a; }
.era li.me .yr { color: var(--accent); }
.era b { font-size: 17px; letter-spacing: -.01em; }
.era p { font-size: 13.5px; line-height: 1.4; color: var(--muted); }
@media (max-width: 540px) { .era { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 18px; } .era::before { display: none; } }
/* trip map: a paper map in both themes */

.ut-diag { background: var(--surface); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: minmax(0, 250fr) minmax(0, 330fr); gap: 14px; align-items: end; }

@media (max-width: 540px) { .ut-diag { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* Tele-Piano idea animation: always a dark "stage" */
.pn { --pn-bg: #0b0b10; --pn-fg: #f5f5f7; --pn-muted: #a1a1a6; --pn-line: #34343c; --pn-blue: #bf5af2; --pn-warm: #ff9f0a;
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: clamp(16px, 3vw, 28px); display: grid; gap: 18px; color: var(--pn-fg);
  background: radial-gradient(90% 120% at 0% 0%, rgba(191, 90, 242, .22), transparent 55%), radial-gradient(90% 120% at 100% 100%, rgba(255, 159, 10, .2), transparent 55%), var(--pn-bg); }
.pn::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(70% 90% at 50% 100%, rgba(191, 90, 242, .28), transparent 70%); }
.pn.thump::after { animation: pn-thump .45s ease-out; }
@keyframes pn-thump { from { opacity: 1; } to { opacity: 0; } }
.pn > * { position: relative; z-index: 1; }
.pn-stage { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1.5fr); gap: 12px; align-items: center; }
.pn-side { display: grid; gap: 10px; justify-items: center; min-width: 0; }
.pn-tag { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pn-muted); }
.pn-hand { width: 100%; max-width: 230px; height: auto; display: block; overflow: visible; }
.pn-palm { fill: #1c1c24; stroke: #3d3d48; stroke-width: 2; }
.pn-fingers line { stroke: #2a2a34; stroke-width: 19; stroke-linecap: round; }
.pn-fingers line.edge { stroke: #3d3d48; stroke-width: 22; }
.pn-tip { fill: #4a4a56; transition: fill .15s; }
.pn-tip.on { fill: var(--pn-blue); }
.pn-ring { fill: none; stroke: var(--pn-blue); stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
.pn-ring.go { animation: pn-ring .6s ease-out; }
@keyframes pn-ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
.pn-link { position: relative; height: 2px; background: repeating-linear-gradient(90deg, var(--pn-line) 0 6px, transparent 6px 12px); }
.pn-link b { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--pn-blue); }
.pn-link i { position: absolute; top: -4px; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--pn-blue); box-shadow: 0 0 12px var(--pn-blue); animation: pn-zip .35s linear forwards; }
@keyframes pn-zip { from { left: 0; opacity: 1; } to { left: calc(100% - 10px); opacity: .2; } }
.pn-piano { position: relative; width: 100%; max-width: 420px; padding-top: 70px; }
.pn-keys { position: relative; display: flex; height: 150px; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
.pn-key { appearance: none; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; }
.pn-key.w { flex: 1; background: linear-gradient(#ffffff, #ececf0); border-right: 1px solid #c9c9d0; transition: background .08s, transform .08s; transform-origin: top; }
.pn-key.w:last-of-type { border-right: 0; }
.pn-key.b { position: absolute; top: 0; width: 9%; height: 60%; background: linear-gradient(#2c2c34, #0d0d12); border-radius: 0 0 5px 5px; z-index: 2; transform: translateX(-50%); transition: background .08s; }
.pn-key.w.down { background: linear-gradient(#ffe0c7, #ffb07a); transform: scaleY(.985); }
.pn-key.b.down { background: linear-gradient(#d68bff, #8e3dd6); }
.pn-key:focus-visible { outline: 2px solid var(--pn-warm); outline-offset: -3px; }
.pn-note { position: absolute; bottom: 150px; font-size: 22px; line-height: 1; color: var(--pn-warm); pointer-events: none; transform: translateX(-50%); animation: pn-float 1.4s ease-out forwards; }
@keyframes pn-float { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.7); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -64px) scale(1.15); } }
.pn-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pn-chip { font: 500 13px var(--body); padding: 7px 14px; border-radius: 980px; border: 1px solid var(--pn-line); background: rgba(255, 255, 255, .06); color: var(--pn-fg); cursor: pointer; }
.pn-chip[aria-pressed="true"] { border-color: var(--pn-warm); color: var(--pn-warm); }
.pn-hint { font-size: 13px; color: var(--pn-muted); margin-left: auto; }
@media (max-width: 640px) {
  .pn-stage { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .pn-link { width: 2px; height: 40px; justify-self: center; background: repeating-linear-gradient(180deg, var(--pn-line) 0 6px, transparent 6px 12px); }
  .pn-link b { left: 14px; top: 50%; transform: translateY(-50%); }
  .pn-link i { left: -4px; animation-name: pn-zip-v; }
  .pn-hand { max-width: 170px; }
  .pn-piano { padding-top: 56px; }
  .pn-hint { margin-left: 0; width: 100%; }
}
@keyframes pn-zip-v { from { top: 0; opacity: 1; } to { top: calc(100% - 10px); opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .pn-note, .pn-link i, .pn-ring.go { animation-duration: .01s; } }
/* takeaway line */
.key { font-size: clamp(17px, 2vw, 19px); line-height: 1.45; color: var(--muted); border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin-top: 4px; }
.key strong { color: var(--fg); font-weight: 600; }

.mx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-left: auto; }

@media (max-width: 860px) { .mx-read { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mx-legend { margin-left: 0; width: 100%; } }
@media (max-width: 640px) { .mx-views { grid-template-columns: minmax(0, 1fr); } }

}

.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; border-top: 1px solid var(--line); padding-top: 24px; margin-top: 16px; }

/* ---------- rendezvous simulator ---------- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 320px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }

@media (max-width: 640px) { .sim-stage { display: flex; flex-direction: column; } .sim-clock { position: static; order: -1; padding: 14px 16px 0; } .sim-legend { position: static; padding: 4px 16px 16px; } }

.btn { font: 500 15px var(--body); color: #ffffff; background: #0071e3; border: 0; border-radius: 980px; padding: 9px 20px; cursor: pointer; justify-self: start; }

/* ---------- editor panel ---------- */
.editor { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--panel-w), 100vw); z-index: 30; background: var(--page-alt); color: var(--fg); box-shadow: -20px 0 60px rgba(0, 0, 0, .18); display: grid; grid-template-rows: auto auto minmax(0, 1fr); font-size: 14px; letter-spacing: -.005em; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); border-left: 1px solid var(--line); }

.ed-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }

.ed-field { display: grid; gap: 5px; min-width: 0; }

.editor input[type=text], .editor textarea, .editor select { font: 14px/1.45 var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); color: var(--fg); width: 100%; min-width: 0; }
.editor textarea { resize: vertical; min-height: 64px; }

.ed-check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.ed-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.ed-icon { font: 600 12px var(--body); min-width: 26px; height: 26px; padding: 0 7px; border-radius: 8px; border: 1px solid var(--line); background: var(--page-alt); color: var(--fg); cursor: pointer; }

        "heading": "Why this is cool",
        "html": "<div class='hook'><div class='hook-text'><span class='hook-kicker'>The puzzle<\/span><h5>Every two years, Mars moonwalks.<\/h5><p>It slows down, <strong>drifts backward across the sky for about two months<\/strong>, then carries on as if nothing happened.<\/p><\/div><svg class='hook-loop' viewBox='0 0 320 120' role='img' aria-label='Mars path across the sky: moving forward, looping backward for about two months, then forward again'><defs><linearGradient id='hk-g' x1='0' x2='1'><stop offset='0' stop-color='#ff9f0a' stop-opacity='.35'/><stop offset='.45' stop-color='#ff6a3d'/><stop offset='.6' stop-color='#bf5af2'/><stop offset='.75' stop-color='#ff6a3d'/><stop offset='1' stop-color='#ff6a3d'/><\/linearGradient><\/defs><g class='hk-stars'><circle cx='22' cy='18' r='1.2'/><circle cx='64' cy='40' r='0.9'/><circle cx='98' cy='12' r='1.4'/><circle cx='140' cy='96' r='1'/><circle cx='170' cy='14' r='1.1'/><circle cx='236' cy='102' r='1.3'/><circle cx='262' cy='62' r='0.9'/><circle cx='300' cy='92' r='1.2'/><circle cx='46' cy='104' r='1'/><circle cx='122' cy='66' r='0.8'/><circle cx='284' cy='14' r='1'/><circle cx='210' cy='24' r='0.8'/><\/g><path d='M8 98 C60 86 112 62 150 54 C190 46 214 72 196 84 C176 97 158 64 196 52 C236 40 276 32 300 24' fill='none' stroke='url(#hk-g)' stroke-width='3.5' stroke-linecap='round'/><circle cx='300' cy='24' r='7' fill='#ff6a3d'/><circle cx='300' cy='24' r='12' fill='#ff6a3d' opacity='.18'/><text x='186' y='112' class='hk-lbl'>← backward, ~70 days<\/text><text x='14' y='84' class='hk-lbl2'>forward<\/text><\/svg><\/div><ol class='era'><li><span class='yr'>~150 AD<\/span><b>Ptolemy<\/b><p>Earth at the centre. The loops get explained with circles on circles.<\/p><\/li><li><span class='yr'>1543<\/span><b>Copernicus<\/b><p>Puts the Sun at the centre. The loops become a trick of perspective.<\/p><\/li><li class='hl'><span class='yr'>1609<\/span><b>Kepler<\/b><p>Cracks Mars's real orbit: an ellipse. Right inside our 1600–1650 data.<\/p><\/li><li class='me'><span class='yr'>Today<\/span><b>Us<\/b><p>18,264 days of NASA positions, and code to test it all.<\/p><\/li><\/ol><p class='key'><strong>We went further than \"it's a perspective effect\".<\/strong> We measured Mars's orbit from raw numbers, checked it against the laws of physics, and tested whether a computer can predict it.<\/p>"

        "heading": "What we discovered",
        "html": "<div class='facts'><div><b>24<\/b><span>retrograde loops in our 50 years of data<\/span><\/div><div><b>60–81 days<\/b><span>how long each backward drift lasts<\/span><\/div><div><b>779 days<\/b><span>between loops: the time it takes Earth to lap Mars<\/span><\/div><div><b>56–400M km<\/b><span>Earth–Mars distance, a more than 7× swing<\/span><\/div><\/div><p class='key'><strong>Retrograde motion isn't Mars reversing.<\/strong> Earth is on the faster inside track, and when it overtakes Mars our line of sight swings backward against the stars for a couple of months. In the Sun-centred view nothing ever goes backward.<\/p>"

        "html": "<div class='tbl'><table><thead><tr><th>Orbital element<\/th><th>From our data<\/th><th>Textbook<\/th><\/tr><\/thead><tbody><tr><td>Semi-major axis, a<\/td><td class='best'>227.96 M km (1.524 AU)<\/td><td>227.9 M km<\/td><\/tr><tr><td>Eccentricity, e<\/td><td class='best'>0.0931<\/td><td>0.0934<\/td><\/tr><tr><td>Period, T<\/td><td class='best'>687.1 days<\/td><td>687.0 days<\/td><\/tr><tr><td>Inclination, i<\/td><td class='best'>1.88°<\/td><td>1.85°<\/td><\/tr><tr><td>Perihelion / aphelion<\/td><td>206.7 / 249.2 M km<\/td><td>–<\/td><\/tr><\/tbody><\/table><\/div><p class='key'>Angular momentum and specific energy stayed constant to about <strong>0.01%<\/strong> over all 50 years, exactly what a two-body orbit predicts. That check is also how I knew the whole data pipeline was right.<\/p>"

       {
        "heading": "How my code works, step by step",
        "html": "<ol class='steps'><li><b>Pull the data<\/b><p>Daily position and velocity vectors from NASA JPL Horizons, 1600 to 1650. The useful part of each file sits between the <code>$$SOE<\/code> and <code>$$EOE<\/code> markers, so a small reader cuts it out and loads it into a table.<\/p><details class='code'><summary>See my Python<\/summary><pre><code>block = content[start + len('$$SOE'):end]\ndf = pd.read_csv(StringIO(block), names=columns)<\/code><\/pre><\/details><\/li><li><b>Move the camera to the Sun<\/b><p>Horizons gives Mars and the Sun <strong>as seen from Earth<\/strong>. Subtracting one from the other gives Mars <strong>as seen from the Sun<\/strong>. That's the relative motion equation:<\/p><div class='eq'><b class='v'>r<\/b><sub>Mars/Sun<\/sub> = <b class='v'>r<\/b><sub>Mars/Earth<\/sub> − <b class='v'>r<\/b><sub>Sun/Earth<\/sub><\/div><p class='tip'><b>Watch out for reference frames.<\/b> Horizons can measure coordinates from the plane of Earth's orbit (ecliptic) or from Earth's equator (ICRF). Those two are tilted 23.4° apart, Earth's axial tilt, so both files must use the same one. Mix them and Mars's orbit comes out tilted 21.8° instead of 1.9°.<\/p><details class='code'><summary>See my Python<\/summary><pre><code>r_se = -r_sun            # Earth, seen from the Sun\nr_sm = r_se + r_planet   # Mars, seen from the Sun<\/code><\/pre><\/details><\/li><li><b>Check the physics<\/b><p>In a two-body orbit, two quantities can <strong>never change<\/strong>: angular momentum and specific energy. If they drift, the data or the code is wrong.<\/p><div class='eqs'><div class='eq'><b class='v'>h<\/b> = <b class='v'>r<\/b> × <b class='v'>v<\/b><small>angular momentum<\/small><\/div><div class='eq'><i>ε<\/i> = <span class='fr'><span><i>v<\/i><sup>2<\/sup><\/span><span>2<\/span><\/span> − <span class='fr'><span><i>μ<\/i><\/span><span><i>r<\/i><\/span><\/span><small>specific energy<\/small><\/div><\/div><p class='legend'><i>μ<\/i> is the Sun's gravitational parameter, 1.327 × 10<sup>11<\/sup> km³/s².<\/p><details class='code'><summary>See my Python<\/summary><pre><code>h_vec  = np.cross(r, v)\nenergy = 0.5*v_norm**2 - mu_sun/r_norm<\/code><\/pre><\/details><\/li><li><b>Back out the orbit<\/b><p>Those two constants are enough to rebuild <strong>the whole ellipse<\/strong>: its size, shape, period and tilt.<\/p><div class='eqs'><div class='eq'><i>a<\/i> = −<span class='fr'><span><i>μ<\/i><\/span><span>2<i>ε<\/i><\/span><\/span><small>size<\/small><\/div><div class='eq'><i>e<\/i> = <span class='sq'>√<span>1 − <span class='fr'><span><i>h<\/i><sup>2<\/sup><\/span><span><i>μ<\/i><i>a<\/i><\/span><\/span><\/span><\/span><small>shape<\/small><\/div><div class='eq'><i>T<\/i> = 2π<span class='sq'>√<span><span class='fr'><span><i>a<\/i><sup>3<\/sup><\/span><span><i>μ<\/i><\/span><\/span><\/span><\/span><small>period<\/small><\/div><div class='eq'><i>i<\/i> = cos<sup>−1<\/sup><span class='fr'><span><i>h<\/i><sub>z<\/sub><\/span><span><i>h<\/i><\/span><\/span><small>tilt<\/small><\/div><\/div><details class='code'><summary>See my Python<\/summary><pre><code>a = -mu_sun / (2*mean_energy)\ne = np.sqrt(1 - h**2 / (mu_sun*a))\nT = 2*np.pi*np.sqrt(a**3 / mu_sun)\ni = np.degrees(np.arccos(h_z / h))<\/code><\/pre><\/details><\/li><li><b>Predict it (team)<\/b><p>Then the reverse test: start from one day's position and velocity, integrate the equation of motion forward in MATLAB, and see how long the prediction stays on top of the real thing.<\/p><div class='eq'><b class='v'>r̈<\/b> = −<span class='fr'><span><i>μ<\/i><\/span><span><i>r<\/i><sup>3<\/sup><\/span><\/span> <b class='v'>r<\/b><small>two-body equation of motion<\/small><\/div><\/li><\/ol>"

        "heading": "Which solver can you trust?",
        "text": "We gave nine MATLAB solvers the same starting point and compared each prediction with Horizons. All of them found Mars's period of about 688 days, but their accuracy was very different.",
        "html": "<div class='tbl'><table><thead><tr><th>Solver<\/th><th>Avg. error vs. Horizons, 50 yr<\/th><th>Run time, 1,000 yr<\/th><\/tr><\/thead><tbody><tr><td>ode89<\/td><td class='best'>0.45%<\/td><td>5.1 s<\/td><\/tr><tr><td>ode23t<\/td><td>0.53%<\/td><td>14.6 s<\/td><\/tr><tr><td>ode23tb<\/td><td>1.86%<\/td><td>15.1 s<\/td><\/tr><tr><td>ode23s<\/td><td>3.31%<\/td><td>15.4 s<\/td><\/tr><tr><td>ode23<\/td><td>4.77%<\/td><td>2.3 s<\/td><\/tr><tr><td>ode113<\/td><td>5.00%<\/td><td>3.9 s<\/td><\/tr><tr><td>ode78<\/td><td>6.36%<\/td><td>29.4 s<\/td><\/tr><tr><td>ode15s<\/td><td>14.38%<\/td><td class='worst'>Diverges<\/td><\/tr><tr><td>ode45<\/td><td class='worst'>27.67%<\/td><td class='worst'>Diverges<\/td><\/tr><\/tbody><\/table><\/div>",
        "text2": "**The surprise:** **ode45**, MATLAB's go-to solver, was the worst, with 27.7% average error, and it diverged over 1,000 years. **ode89** was about 60× more accurate. Even at a tolerance near 10⁻¹⁵ the prediction never matches Horizons perfectly, because the real Mars is also pulled by Jupiter and the other planets. That gap is the limit of the two-body model, not of the solver.\n\n**Is that result normal?** Yes: orbits are smooth, which is where high-order methods like ode89 shine, and NASA's GMAT mission-design software uses an 8th/9th-order Runge-Kutta integrator by default. One caveat: we compared the solvers at MATLAB's default error tolerances. Tightening them would narrow the gap, especially for ode45 and ode113, at the cost of run time."

        "text": "A probe sends a short burst of **high-frequency sound** into the metal, far above what we can hear. The sound bounces off whatever it meets: the back wall of the part, or a crack, void or corroded spot hiding inside. The flaw detector plots those echoes as peaks on an **A-scan**.",
        "html": "<div class='ut-diag' role='img' aria-label='Ultrasonic testing: a probe on a steel plate sends a sound pulse down. Part of it echoes off a hidden flaw, the rest off the back wall. The A-scan shows three peaks: the initial pulse, a small flaw echo, and the back-wall echo.'><svg class='ut-plate' viewBox='10 0 250 210'><g><rect x='20' y='70' width='230' height='110' rx='6' style='fill:var(--surface-2);stroke:var(--line)'/><path d='M24 180 H246' style='stroke:var(--fg);stroke-width:2.5;stroke-linecap:round'/><text x='135' y='198' text-anchor='middle' class='ut-t'>steel plate<\/text><rect x='72' y='70' width='40' height='110' style='fill:var(--accent);opacity:.13'/><rect x='70' y='38' width='44' height='32' rx='5' style='fill:var(--accent)'/><text x='92' y='30' text-anchor='middle' class='ut-t strong'>probe<\/text><path d='M80 72 V177' style='stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4'/><path d='M100 72 V108' style='stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4'/><ellipse cx='104' cy='116' rx='20' ry='6' style='fill:var(--page);stroke:var(--bad);stroke-width:2'/><text x='130' y='120' class='ut-t' style='fill:var(--bad)'>hidden flaw<\/text><text x='244' y='172' text-anchor='end' class='ut-t strong'>back wall<\/text><\/g><\/svg><svg class='ut-scan' viewBox='290 0 330 210'><g transform='translate(290 0)'><path d='M10 180 H320 M10 180 V30' style='stroke:var(--line);fill:none'/><text x='320' y='198' text-anchor='end' class='ut-t'>time →<\/text><text x='14' y='24' class='ut-t'>echo strength<\/text><path d='M10 178 L30 178 L36 40 L42 178 L106 178 L112 120 L118 178 L240 178 L246 70 L252 178 L320 178' style='fill:none;stroke:#30d158;stroke-width:2.5;stroke-linejoin:round'/><text x='47' y='52' class='ut-t strong'>pulse<\/text><text x='112' y='112' text-anchor='middle' class='ut-t' style='fill:var(--bad)'>flaw<\/text><text x='249' y='62' text-anchor='middle' class='ut-t strong'>back wall<\/text><\/g><\/svg><\/div><div class='eqs'><div class='eq'><i>d<\/i> = <span class='fr'><span><i>v<\/i> · <i>t<\/i><\/span><span>2<\/span><\/span><small>depth or thickness<\/small><\/div><\/div><p class='key'><strong>The echo's timing tells you where things are.<\/strong> Sound travels through steel at about 5.9 km/s. Measure how long the echo takes to come back, multiply by the speed and halve it (down and back), and you get the plate's thickness, or exactly how deep a hidden flaw sits.<\/p>"

        "text": "I completed the **Certification to Degree (C2D) Ultrasonic Testing training** at NMSU's NDE Lab. It's part of a Department of Defense-funded consortium between Arizona State University, NMSU and Navajo Technical University that builds pathways into advanced manufacturing and non-destructive evaluation.",
        "html": "<ol class='era five'><li><span class='yr'>1<\/span><b>Theory<\/b><p>How sound moves through materials and what echoes mean.<\/p><\/li><li><span class='yr'>2<\/span><b>Calibrate<\/b><p>Set up the flaw detector on a stepped calibration block.<\/p><\/li><li><span class='yr'>3<\/span><b>Read A-scans<\/b><p>Turn the peaks on the screen into real distances.<\/p><\/li><li class='hl'><span class='yr'>4<\/span><b>Find flaws<\/b><p>Inspect real test pieces, including a badly corroded plate.<\/p><\/li><li class='me'><span class='yr'>5<\/span><b>Certificate<\/b><p>Completed the C2D ultrasonic testing training.<\/p><\/li><\/ol>",

    playBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) loop = later(step, 700);
    return function () {
      alive = false;
      timers.forEach(clearTimeout); timers = [];
      if (audio) { try { audio.close(); } catch (e) {} }
    };
  }

  // ---------- RC plane: balance it, then fly it ----------
  var PLANE_HTML = '<div class="pl" role="group" aria-label="Animation: a battery slides along the plane until its center of gravity lines up with the wing\'s lift, then the plane flies for about 6 seconds and crashes">' +
    '<svg viewBox="0 0 640 250" aria-hidden="true">' +
    '<line id="pl-ground" class="pl-ground" x1="20" x2="620" y1="226" y2="226" opacity="0"/>' +
    '<g id="pl-pivotg"><path class="pl-pivot" d="M335 148 L318 182 L352 182 Z"/><rect class="pl-pivot" x="290" y="182" width="90" height="6" rx="3"/></g>' +
    '<text id="pl-status" class="pl-status" x="24" y="34"></text>' +
    '<text id="pl-timer" class="pl-timer" x="616" y="36" text-anchor="end" opacity="0">0.0 s</text>' +
    '<g id="pl-plane">' +
      '<g id="pl-liftg"><path class="pl-lift" d="M15 -26 V-70 M7 -60 L15 -72 L23 -60"/><text class="pl-lbl blue" x="24" y="-62">lift</text></g>' +
      '<path class="pl-wing" d="M-150 -7 L-139 -42 L-119 -42 L-111 -7 Z"/>' +
      '<rect class="pl-body" x="-150" y="-7" width="290" height="14" rx="7"/>' +
      '<path class="pl-body" d="M139 -7 Q158 0 139 7 Z"/>' +
      '<rect class="pl-wing" x="-152" y="-3" width="40" height="6" rx="3"/>' +
      '<path class="pl-wing" d="M-25 -7 Q8 -22 55 -10 L55 -7 Z"/>' +
      '<rect class="pl-motor" x="120" y="-5" width="18" height="10" rx="2"/>' +
      '<rect class="pl-rx" x="-72" y="-4" width="20" height="8" rx="2"/>' +
      '<g id="pl-bat"><rect class="pl-bat" x="-14" y="-5.5" width="28" height="11" rx="2"/></g>' +
      '<ellipse id="pl-prop" class="pl-prop" cx="160" cy="0" rx="2.5" ry="17"/>' +
      '<g id="pl-cg"><circle class="pl-cg" cx="0" cy="24" r="7"/><path class="pl-cgx" d="M-7 24 H7 M0 17 V31"/><text class="pl-lbl red" x="11" y="28">CG</text></g>' +
    '</g>' +
    '<g id="pl-puff" class="pl-puff" opacity="0"><circle id="pl-p1" r="1"/><circle id="pl-p2" r="1"/><circle id="pl-p3" r="1"/></g>' +
    '</svg>' +
    '<div class="legend-pl"><span><i style="background:#e8590c"></i>Battery (the part we move)</span><span><i style="background:#6e6e73"></i>Motor</span><span><i style="background:#1d8a4c"></i>Receiver</span><span><i style="background:#d70015;border-radius:50%"></i>Center of gravity</span><span><i style="background:#c77dff"></i>Lift</span></div>' +
    '<div class="pl-bar"><p class="pl-cap" id="pl-cap"></p><button type="button" class="pl-btn" id="pl-replay">Replay</button></div>' +
    '</div>';

  function startPlane(root) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var plane = $('#pl-plane', root), bat = $('#pl-bat', root), cgm = $('#pl-cg', root), lift = $('#pl-liftg', root), pivot = $('#pl-pivotg', root);
    var ground = $('#pl-ground', root), timer = $('#pl-timer', root), status = $('#pl-status', root), cap = $('#pl-cap', root), prop = $('#pl-prop', root);
    var puff = $('#pl-puff', root), p1 = $('#pl-p1', root), p2 = $('#pl-p2', root), p3 = $('#pl-p3', root);
    var CL = 15, LOOP = 15, alive = true, start = null, ang = 0, lastCap = '', playing = !reduce;
    // weights (arbitrary units) and positions along the fuselage: airframe, motor, receiver; the battery moves
    function cgOf(bx) { return (5 * -30 + 3 * 135 + 1 * -60 + 4 * bx) / 13; }
    function ease(u) { u = Math.max(0, Math.min(1, u)); return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function batAt(t) {
      if (t < 1) return -110;
      if (t < 2.5) return lerp(-110, 60, ease((t - 1) / 1.5));
      if (t < 3.5) return 60;
      if (t < 4.8) return lerp(60, 0, ease((t - 3.5) / 1.3));
      return 0;
    }
    function setCap(html) { if (html !== lastCap) { lastCap = html; cap.innerHTML = html; } }
    function frame(t, dt) {
      var bx = batAt(t), cg = cgOf(bx), x = 320, y = 140, s = 1, target = Math.max(-14, Math.min(14, (cg - CL) * 0.45));
      var over = 1, tm = 0, showTimer = 0, puffU = -1;
      bat.setAttribute('transform', 'translate(' + bx.toFixed(1) + ' 0)');
      cgm.setAttribute('transform', 'translate(' + cg.toFixed(1) + ' 0)');
      if (t < 6) {
        ang += (target - ang) * Math.min(1, dt * 5);
        var off = Math.abs(cg - CL);
        if (off < 2 && t > 4.4) { status.textContent = 'BALANCED ✓'; status.setAttribute('fill', '#1d8a4c'); }
        else { status.textContent = cg < CL ? 'TAIL-HEAVY: nose pitches up' : 'NOSE-HEAVY: nose dives'; status.setAttribute('fill', '#d70015'); }
        if (t < 1.6) setCap('<b>Battery too far back.</b> The center of gravity sits behind the lift, so the nose pitches up.');
        else if (t < 3.6) setCap('<b>Too far forward.</b> Now it\'s nose-heavy and wants to dive.');
        else setCap('<b>Center of gravity right under the lift: balanced.</b> This is the statics part: where every component goes.');
      } else if (t < 6.8) {
        var u = ease((t - 6) / 0.8);
        s = lerp(1, 0.42, u); x = lerp(320, 80, u); y = lerp(140, 160, u); over = 1 - u; ang += (-4 - ang) * Math.min(1, dt * 5);
        status.textContent = '';
        setCap('<b>Ready for launch…</b>');
      } else if (t < 11.3) {
        var f = (t - 6.8) / 4.5; s = 0.42; over = 0; showTimer = 1; tm = f * 6;
        x = lerp(80, 560, f);
        if (f < 0.8) { y = 160 - 50 * Math.sin(f / 0.8 * Math.PI / 2) + 5 * Math.sin(f * 26); ang = -7 + 5 * Math.cos(f * 26); }
        else { var g = (f - 0.8) / 0.2, y0 = 110 + 5 * Math.sin(0.8 * 26); y = lerp(y0, 190, g * g); ang = lerp(-2, 38, g); }
        setCap('<b>It flies!</b> Our first plane in the air…');
      } else {
        s = 0.42; over = 0; showTimer = 1; tm = 6; x = 560; y = 190; ang = 38; puffU = Math.min(1, (t - 11.3) / 0.7);
        setCap('<b>About 6 seconds of flight, then the ground.</b> Short flight, big lesson.');
      }
      plane.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + s.toFixed(3) + ') rotate(' + ang.toFixed(2) + ' ' + CL + ' 0)');
      prop.setAttribute('ry', (t > 6 && t < 11.3 ? 3 + 14 * Math.abs(Math.cos(t * 40)) : 17).toFixed(1));
      pivot.setAttribute('opacity', over.toFixed(2)); lift.setAttribute('opacity', over.toFixed(2)); cgm.setAttribute('opacity', over.toFixed(2));
      ground.setAttribute('opacity', (1 - over).toFixed(2));
      timer.setAttribute('opacity', showTimer); timer.textContent = tm.toFixed(1) + ' s';
      if (puffU >= 0) {
        puff.setAttribute('opacity', (1 - puffU * 0.85).toFixed(2));
        [[p1, -14, 0, 14], [p2, 6, -6, 18], [p3, 22, 2, 12]].forEach(function (c) {
          c[0].setAttribute('cx', 606 + c[1] * (0.6 + puffU)); c[0].setAttribute('cy', 222 + c[2] * (0.6 + puffU)); c[0].setAttribute('r', (c[3] * (0.3 + puffU)).toFixed(1));
        });
      } else puff.setAttribute('opacity', 0);
    }
    var last = null;
    function tick(now) {
      if (!alive) return;
      if (start === null) start = now;
      var dt = last === null ? 0.016 : Math.min(0.05, (now - last) / 1000); last = now;
      var t = ((now - start) / 1000) % LOOP;
      frame(t, dt);
      if (playing) requestAnimationFrame(tick);
    }
    $('#pl-replay', root).addEventListener('click', function () {
      start = null; last = null; ang = 0;
      if (!playing) { playing = true; requestAnimationFrame(tick); }
    });
    if (playing) requestAnimationFrame(tick);
    else { ang = 0; frame(5, 1); }
    return function () { alive = false; };
  }

  // ---------- boot ----------
  function boot(data) {
    site = data; savedStr = JSON.stringify(site);
    try { if (localStorage.getItem(NOTES_KEY) === '1') document.body.classList.add('notes'); } catch (e) {}
    renderView(true);
  }
  var fallback = JSON.parse(document.getElementById('site-fallback').textContent);
  boot(fallback);

  window.addEventListener('hashchange', function () {
    renderView(false);
    if (editing) { var t = targetFromRoute(); if (t !== edTarget && edTarget !== 'new' && edTarget !== 'footer') { edTarget = t; edTab = 'page'; renderEditor(); } }
  });
  window.addEventListener('beforeunload', function (e) { if (editing && isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  $('#edit-btn').addEventListener('click', function () { if (editing) closeEditor(); else openEditor(); });

  // the saved data file is the source of truth; the copy in the page is only for the first paint
  fetch(DATA_PATH, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (txt) {
    var data = JSON.parse(txt);
    if (JSON.stringify(data) !== savedStr) { site = data; savedStr = JSON.stringify(data); renderView(true); }
  }).catch(function () {}).then(function () { lightUpEditing(); });

  // résumé buttons: hand the PDF to the viewer through the downloads capability
  var DL = null;
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('.resume-btn') : null;
    if (!a || !DL) return;
    ev.preventDefault();
    if (a.getAttribute('aria-busy') === 'true') return;
    var href = a.getAttribute('href'), name = href.split('/').pop() || 'resume.pdf';
    a.setAttribute('aria-busy', 'true');
    fetch(href).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { return DL.save({ filename: name, data: b }); })
      .then(function () {}, function () {})
      .then(function () { a.removeAttribute('aria-busy'); });
  });
  function lightUpEditing() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    window.claude.use('downloads').then(function (d) { DL = d; }, function () {});
    Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('assets')]).then(function (res) {
      var user = res[0]; ART = res[1]; ASSETS = res[2];
      return Promise.resolve(user ? user.canEdit() : false).then(function (can) {
        CAN_EDIT = !!can;
        if (!CAN_EDIT || !ART) return;
        try {
          var d = localStorage.getItem(DRAFT_KEY);
          if (d && d !== savedStr) pendingDraft = JSON.parse(d);
        } catch (e) { pendingDraft = null; }
        $('#edit-btn').hidden = false;
        updateStatus();
      });
    }).catch(function () {});
  }
})();
</script>
